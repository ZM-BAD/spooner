# CI workflow installed by spooner transform Stage 2 (warn-only quality gates;
# the only hard gate is declared-command executability)
name: ai-native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit (markdownlint + common checks, warn-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pre-commit
      - run: pre-commit run --all-files
      # commitlint runs on the commit-msg stage (never run by --all-files);
      # write the last commit into .git/COMMIT_EDITMSG (what the hook reads);
      # --commit-msg-filename is required by pre-commit for this hook stage
      - name: commitlint — last commit (warn-only)
        run: |
          git log -1 --format=%B > .git/COMMIT_EDITMSG
          pre-commit run --hook-stage commit-msg --commit-msg-filename .git/COMMIT_EDITMSG

  lint-test:
    name: lint + test (warn-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci || npm install
      # declared scripts only — a repo without lint/test scripts must not red
      # (same trust model as the declared-commands gate)
      - name: lint + test (declared scripts only)
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const scripts = require("./package.json").scripts || {};
            for (const k of ["lint", "test"]) {
              if (typeof scripts[k] === "string") { console.log("> npm run " + k); execSync("npm run " + k, { stdio: "inherit" }); }
              else { console.log("no " + k + " script declared — skipped"); }
            }
          '

  security:
    name: secret scan (gitleaks, warn-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  declared-commands:
    name: declared build/test commands executable (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci || npm install
      - name: Run declared build/test scripts
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const scripts = require("./package.json").scripts || {};
            // self-contained build/test families only: check/verify chain
            // external tooling (pre-commit etc.) and are excluded from the gate
            const keys = ["build", "compile", "typecheck", "test", "spec"];
            const declared = keys.filter((k) => typeof scripts[k] === "string");
            if (declared.length === 0) { console.log("no build/test scripts declared"); process.exit(0); }
            for (const k of declared) { console.log("> npm run " + k); execSync("npm run " + k, { stdio: "inherit" }); }
          '
