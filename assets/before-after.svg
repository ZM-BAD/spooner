<svg xmlns="http://www.w3.org/2000/svg" width="640" height="150" role="img" aria-label="AI readiness before and after the spooner transform: 4/10 AI-Aware becomes 9.2/10 AI-Native">
  <title>AI readiness: 4/10 → 9.2/10</title>
  <!-- before card: grey label + red message -->
  <rect x="10" y="30" width="110" height="48" rx="6" fill="#555"/>
  <text x="65" y="60" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="16" fill="#fff" text-anchor="middle">BEFORE</text>
  <rect x="120" y="30" width="200" height="48" rx="6" fill="#e05d44"/>
  <text x="220" y="60" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="16" fill="#fff" text-anchor="middle">AI-Aware · 4/10</text>
  <!-- arrow -->
  <text x="340" y="64" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="34" fill="#888" text-anchor="middle">→</text>
  <!-- after card: grey label + green message -->
  <rect x="370" y="30" width="110" height="48" rx="6" fill="#555"/>
  <text x="425" y="60" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="16" fill="#fff" text-anchor="middle">AFTER</text>
  <rect x="480" y="30" width="150" height="48" rx="6" fill="#4c1"/>
  <text x="555" y="60" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="16" fill="#fff" text-anchor="middle">AI-Native · 9.2/10</text>
  <!-- caption -->
  <text x="320" y="120" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="13" fill="#888" text-anchor="middle">one run of the spooner pipeline — audit → gates → AGENTS.md → SDD</text>
</svg>
