# pre-commit config installed by spooner transform Stage 2 (warn-only gates)
# Install hooks (commitlint runs on the commit-msg stage — both are required):
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
# Full run: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-symlinks
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        additional_dependencies:
          - markdownlint-cli2@0.23.2
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/cli@21.2.1"
          - "@commitlint/config-conventional@21.2.0"
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
  # Local hooks: keep pre-commit a superset of CI — typecheck and the test
  # suite run in CI but must also run locally, or a green pre-commit can ship
  # a red CI. Declared-only (same trust model as the CI lint-test job): a repo
  # without these npm scripts skips them; a repo WITH them runs them for real
  # (a failing script fails the hook — never masked as "not declared").
  - repo: local
    hooks:
      - id: typecheck
        name: TypeScript typecheck (declared)
        entry: bash -c 'node -e "const{execSync}=require(\"node:child_process\");const s=require(\"./package.json\").scripts||{};if(typeof s.typecheck===\"string\"){console.log(\"> npm run typecheck\");execSync(\"npm run typecheck\",{stdio:\"inherit\"})}else console.log(\"no typecheck script declared — skipped\")"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: test
        name: npm test (declared)
        entry: bash -c 'node -e "const{execSync}=require(\"node:child_process\");const s=require(\"./package.json\").scripts||{};if(typeof s.test===\"string\"){console.log(\"> npm test\");execSync(\"npm test\",{stdio:\"inherit\"})}else console.log(\"no test script declared — skipped\")"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: manifest-consistency
        name: .ai-native.yml consistency + version (gate)
        entry: node skills/spooner/scripts/transform.ts --stage all --dry-run --format markdown --manifest-gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
